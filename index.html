<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2E7D32">
    <title>Lista Spesa</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --g: #2E7D32;
            --gl: #4CAF50;
            --gb: #E8F5E9;
            --o: #FF6F00;
            --ob: #FFF3E0;
            --b: #1565C0;
            --bb: #E3F2FD;
            --r: #C62828;
            --gr: #757575;
            --grl: #E0E0E0;
            --grb: #F5F5F5;
            --w: #FFF;
            --sh: 0 2px 8px rgba(0, 0, 0, .1);
            --rad: 12px;
            --th: 60px;
            --hh: 56px;
            --sb: env(safe-area-inset-bottom, 0px)
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--grb);
            color: #212121;
            overflow-x: hidden;
            padding-bottom: calc(var(--th)+var(--sb)+8px)
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--g);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--sh);
            min-height: var(--hh)
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center
        }

        .hbtn {
            background: rgba(255, 255, 255, .2);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .hbtn:active {
            background: rgba(255, 255, 255, .35)
        }

        .obadge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px
        }

        .obadge.on {
            background: var(--gb);
            color: var(--g)
        }

        .obadge.off {
            background: var(--ob);
            color: var(--o)
        }

        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--w);
            display: flex;
            box-shadow: 0 -2px 10px rgba(0, 0, 0, .1);
            padding-bottom: var(--sb)
        }

        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--gr);
            font-size: 11px;
            font-weight: 600;
            position: relative
        }

        .tab.active {
            color: var(--g)
        }

        .tab-icon {
            font-size: 22px;
            margin-bottom: 2px
        }

        .tbadge {
            position: absolute;
            top: 2px;
            right: calc(50% - 22px);
            background: var(--o);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px
        }

        .tbadge:empty {
            display: none
        }

        .page {
            display: none;
            padding: 8px
        }

        .page.active {
            display: block
        }

        .sbox-wrap {
            position: sticky;
            top: var(--hh);
            z-index: 50;
            background: var(--grb);
            padding: 8px 8px 4px;
            margin: -8px -8px 0
        }

        .sbox {
            display: flex;
            align-items: center;
            background: var(--w);
            border-radius: var(--rad);
            padding: 0 12px;
            box-shadow: var(--sh)
        }

        .sbox input {
            flex: 1;
            border: none;
            outline: none;
            padding: 11px 8px;
            font-size: 15px;
            background: transparent
        }

        .sclr {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--gr);
            cursor: pointer;
            padding: 4px;
            display: none
        }

        .sclr.v {
            display: block
        }

        .chips {
            position: sticky;
            top: calc(var(--hh)+48px);
            z-index: 49;
            background: var(--grb);
            margin: 0 -8px;
            padding: 6px 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none
        }

        .chips::-webkit-scrollbar {
            display: none
        }

        .chip {
            display: inline-block;
            padding: 7px 12px;
            margin-right: 5px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            background: var(--w);
            color: #555;
            border: 2px solid var(--grl);
            cursor: pointer;
            user-select: none
        }

        .chip.active {
            background: var(--g);
            color: #fff;
            border-color: var(--g)
        }

        .cnt {
            font-size: 11px;
            color: var(--gr);
            padding: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .abtn {
            background: var(--g);
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer
        }

        .pc {
            background: var(--w);
            border-radius: var(--rad);
            padding: 10px 12px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            border-left: 4px solid transparent
        }

        .pc.sel {
            border-left-color: var(--g);
            background: var(--gb)
        }

        .pc .inf {
            flex: 1;
            min-width: 0
        }

        .pn {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 1px
        }

        .pm {
            font-size: 11px;
            color: var(--gr);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap
        }

        .ab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bb);
            color: var(--b);
            font-size: 10px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 6px;
            min-width: 24px
        }

        .ab.bf {
            background: #F3E5F5;
            color: #7B1FA2
        }

        .ab.bp {
            background: #E0F7FA;
            color: #00838F
        }

        .ab.em {
            background: var(--grl);
            color: var(--gr)
        }

        .pt {
            color: var(--g);
            font-weight: 600
        }

        .pno {
            font-size: 10px;
            color: #999;
            font-style: italic;
            margin-top: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px
        }

        .eb {
            background: none;
            border: none;
            font-size: 16px;
            padding: 4px;
            cursor: pointer;
            opacity: .3
        }

        .eb:active {
            opacity: 1
        }

        .qc {
            display: flex;
            align-items: center;
            flex-shrink: 0
        }

        .qb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid var(--g);
            background: #fff;
            color: var(--g);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .qb:active {
            transform: scale(.9)
        }

        .qb.a {
            background: var(--g);
            color: #fff
        }

        .qb.r {
            border-color: var(--r);
            color: var(--r)
        }

        .qv {
            width: 28px;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: var(--g)
        }

        .ls {
            background: var(--w);
            border-radius: var(--rad);
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--sh);
            text-align: center
        }

        .lsr {
            display: flex;
            justify-content: space-around
        }

        .sv {
            font-size: 26px;
            font-weight: 800;
            color: var(--g)
        }

        .sl {
            font-size: 10px;
            color: var(--gr);
            font-weight: 600;
            text-transform: uppercase
        }

        .as {
            margin-bottom: 10px
        }

        .ah {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            font-weight: 700;
            font-size: 13px;
            color: var(--b);
            position: sticky;
            top: var(--hh);
            background: var(--grb);
            z-index: 10
        }

        .ahb {
            background: var(--b);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px
        }

        .ahb.bf {
            background: #7B1FA2
        }

        .ahb.bp {
            background: #00838F
        }

        .ahb.na {
            background: var(--gr)
        }

        .li {
            background: var(--w);
            border-radius: var(--rad);
            padding: 12px 10px;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            transition: all .3s
        }

        .li.dn {
            opacity: 0;
            transform: translateX(80px);
            max-height: 0;
            padding: 0 10px;
            margin: 0
        }

        .ck {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 3px solid var(--g);
            background: #fff;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: transparent
        }

        .ck:active {
            background: var(--g);
            color: #fff
        }

        .lin {
            flex: 1
        }

        .lnm {
            font-size: 14px;
            font-weight: 600
        }

        .ld {
            font-size: 11px;
            color: var(--gr)
        }

        .lq {
            background: var(--ob);
            color: var(--o);
            font-size: 12px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px
        }

        .es {
            text-align: center;
            padding: 50px 20px;
            color: var(--gr)
        }

        .ei {
            font-size: 56px;
            margin-bottom: 12px
        }

        .et {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #444
        }

        .rb {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            background: #fff;
            color: var(--r);
            border: 2px solid var(--r);
            border-radius: var(--rad);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer
        }

        .rb:active {
            background: var(--r);
            color: #fff
        }

        .mo {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, .5);
            align-items: flex-end;
            justify-content: center
        }

        .mo.active {
            display: flex
        }

        .md {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 20px 16px calc(20px+var(--sb));
            animation: su .3s;
            max-height: 90vh;
            overflow-y: auto
        }

        @keyframes su {
            from {
                transform: translateY(100%)
            }

            to {
                transform: translateY(0)
            }
        }

        .md h2 {
            font-size: 17px;
            margin-bottom: 14px;
            text-align: center
        }

        .ml {
            background: var(--grb);
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            word-break: break-all;
            margin-bottom: 14px;
            text-align: center;
            color: var(--b)
        }

        .mb {
            display: block;
            width: 100%;
            padding: 13px;
            background: var(--g);
            color: #fff;
            border: none;
            border-radius: var(--rad);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 8px
        }

        .mb.s {
            background: var(--grl);
            color: #444
        }

        .mb.d {
            background: var(--r)
        }

        .mb:active {
            opacity: .8
        }

        .fg {
            margin-bottom: 12px
        }

        .fg label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--gr);
            margin-bottom: 4px
        }

        .fg input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--grl);
            border-radius: 8px;
            font-size: 15px
        }

        .fg input:focus {
            border-color: var(--g);
            outline: none
        }

        .fr {
            display: flex;
            gap: 8px
        }

        .fr .fg {
            flex: 1
        }

        .au {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: linear-gradient(135deg, #1B5E20, #2E7D32, #43A047);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px
        }

        .ac {
            background: #fff;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .15);
            text-align: center
        }

        .ac h1 {
            font-size: 48px;
            margin-bottom: 8px
        }

        .ac h2 {
            font-size: 20px;
            color: var(--g);
            margin-bottom: 4px
        }

        .ac p {
            font-size: 13px;
            color: var(--gr);
            margin-bottom: 20px
        }

        .ac input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--grl);
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 12px
        }

        .ac input:focus {
            border-color: var(--g);
            outline: none
        }

        .ac input[type=password] {
            letter-spacing: 4px
        }

        .ae {
            color: var(--r);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            min-height: 20px
        }

        .at {
            color: var(--b);
            font-size: 13px;
            cursor: pointer;
            margin-top: 12px;
            text-decoration: underline
        }

        .ss {
            padding: 20px 16px;
            max-width: 500px;
            margin: 0 auto
        }

        .ss h2 {
            color: var(--g);
            margin-bottom: 14px;
            font-size: 20px
        }

        .ss p {
            margin-bottom: 10px;
            font-size: 13px
        }

        .si {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 2px solid var(--grl);
            border-radius: 8px;
            font-size: 13px;
            font-family: monospace
        }

        .si:focus {
            border-color: var(--g);
            outline: none
        }

        .sb {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: var(--g);
            color: #fff;
            border: none;
            border-radius: var(--rad);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer
        }

        .sb.sk {
            background: var(--grl);
            color: #444;
            margin-top: 6px
        }

        .sn {
            background: var(--ob);
            padding: 10px;
            border-radius: 8px;
            margin: 14px 0;
            font-size: 12px
        }

        .stcard {
            background: var(--w);
            border-radius: var(--rad);
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: var(--sh)
        }

        .stcard h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--gr);
            margin-bottom: 12px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .st-big {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 4px
        }

        .st-big .sv {
            font-size: 32px
        }

        .st-big .sl {
            font-size: 10px;
            color: var(--gr);
            font-weight: 600;
            text-transform: uppercase
        }

        .st-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px
        }

        .st-bar-label {
            font-size: 12px;
            font-weight: 600;
            min-width: 90px;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .st-bar-track {
            flex: 1;
            height: 20px;
            background: var(--grl);
            border-radius: 10px;
            overflow: hidden;
            position: relative
        }

        .st-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width .5s;
            min-width: 2px
        }

        .st-bar-val {
            font-size: 11px;
            font-weight: 700;
            min-width: 50px;
            text-align: left;
            color: var(--gr)
        }

        .st-rank {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--grl)
        }

        .st-rank:last-child {
            border: none
        }

        .st-rank-num {
            font-size: 18px;
            font-weight: 800;
            color: var(--g);
            min-width: 28px;
            text-align: center
        }

        .st-rank-num.gold {
            color: #F9A825
        }

        .st-rank-num.silver {
            color: #90A4AE
        }

        .st-rank-num.bronze {
            color: #8D6E63
        }

        .st-rank-info {
            flex: 1
        }

        .st-rank-name {
            font-size: 13px;
            font-weight: 600
        }

        .st-rank-detail {
            font-size: 11px;
            color: var(--gr)
        }

        .st-rank-badge {
            font-size: 13px;
            font-weight: 700;
            color: var(--g);
            background: var(--gb);
            padding: 3px 10px;
            border-radius: 10px
        }

        .st-trip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--grl)
        }

        .st-trip:last-child {
            border: none
        }

        .st-trip-date {
            min-width: 70px
        }

        .st-trip-day {
            font-size: 14px;
            font-weight: 700;
            color: #333
        }

        .st-trip-time {
            font-size: 10px;
            color: var(--gr)
        }

        .st-trip-info {
            flex: 1
        }

        .st-trip-items {
            font-size: 12px;
            color: var(--gr)
        }

        .st-trip-total {
            font-size: 15px;
            font-weight: 700;
            color: var(--g)
        }

        .st-empty {
            text-align: center;
            padding: 30px;
            color: var(--gr);
            font-size: 13px
        }

        .clr-hist-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: #fff;
            color: var(--gr);
            border: 1px solid var(--grl);
            border-radius: var(--rad);
            font-size: 12px;
            cursor: pointer
        }

        .toast {
            position: fixed;
            bottom: calc(var(--th)+var(--sb)+16px);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: #fff;
            padding: 10px 18px;
            border-radius: 22px;
            font-size: 13px;
            font-weight: 600;
            z-index: 300;
            transition: transform .3s;
            white-space: nowrap
        }

        .toast.v {
            transform: translateX(-50%) translateY(0)
        }

        ::-webkit-scrollbar {
            width: 0
        }
    </style>
</head>

<body>
    <div class="au" id="AS" style="display:none">
        <div class="ac">
            <h1>🛒</h1>
            <h2 id="aT">Lista Spesa</h2>
            <p id="aS">Crea una nuova lista</p>
            <div class="ae" id="aE"></div><input type="text" id="aN" placeholder="Il tuo nome" maxlength="20"><input
                type="password" id="aP" placeholder="Password lista (min 4)"><button class="mb" id="aB"
                onclick="doAuth()">🛒 Crea Lista</button>
            <div class="at" id="aG" onclick="togA()">Hai già un link? Accedi</div>
        </div>
    </div>
    <div class="header">
        <h1>🛒 <span id="hT">Spesa</span></h1>
        <div class="header-actions"><span id="cn" class="obadge off">locale</span><button class="hbtn"
                onclick="showSh()">📤</button><button class="hbtn" onclick="showSt()">⚙️</button></div>
    </div>
    <div id="cP" class="page active">
        <div class="sbox-wrap">
            <div class="sbox"><span>🔍</span><input type="text" id="sI" placeholder="Cerca prodotto..."
                    autocomplete="off"><button class="sclr" id="sC" onclick="clrS()">✕</button></div>
        </div>
        <div class="chips" id="ch"></div>
        <div class="cnt"><span id="cT"></span><button class="abtn" onclick="showPF()">＋ Nuovo</button></div>
        <div id="pL"></div>
    </div>
    <div id="lP" class="page">
        <div id="lC"></div>
    </div>
    <div id="stP" class="page">
        <div id="stC"></div>
    </div>
    <div id="paP" class="page">
        <div id="paC"></div>
