<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2E7D32">
    <title>Lista Spesa</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --g: #2E7D32;
            --gl: #4CAF50;
            --gb: #E8F5E9;
            --o: #FF6F00;
            --ob: #FFF3E0;
            --b: #1565C0;
            --bb: #E3F2FD;
            --r: #C62828;
            --gr: #757575;
            --grl: #E0E0E0;
            --grb: #F5F5F5;
            --w: #FFF;
            --sh: 0 2px 8px rgba(0, 0, 0, .1);
            --rad: 12px;
            --th: 60px;
            --hh: 56px;
            --sb: env(safe-area-inset-bottom, 0px)
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--grb);
            color: #212121;
            overflow-x: hidden;
            padding-bottom: calc(var(--th)+var(--sb)+8px)
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--g);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--sh);
            min-height: var(--hh)
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center
        }

        .hbtn {
            background: rgba(255, 255, 255, .2);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .hbtn:active {
            background: rgba(255, 255, 255, .35)
        }

        .obadge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px
        }

        .obadge.on {
            background: var(--gb);
            color: var(--g)
        }

        .obadge.off {
            background: var(--ob);
            color: var(--o)
        }

        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--w);
            display: flex;
            box-shadow: 0 -2px 10px rgba(0, 0, 0, .1);
            padding-bottom: var(--sb)
        }

        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--gr);
            font-size: 11px;
            font-weight: 600;
            position: relative
        }

        .tab.active {
            color: var(--g)
        }

        .tab-icon {
            font-size: 22px;
            margin-bottom: 2px
        }

        .tbadge {
            position: absolute;
            top: 2px;
            right: calc(50% - 22px);
            background: var(--o);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px
        }

        .tbadge:empty {
            display: none
        }

        .page {
            display: none;
            padding: 8px;
            padding-bottom: calc(var(--th) + var(--sb) + 8px)
        }

        .page.active {
            display: block
        }

        .sbox-wrap {
            position: sticky;
            top: var(--hh);
            z-index: 50;
            background: var(--grb);
            padding: 8px 8px 4px;
            margin: -8px -8px 0
        }

        .sbox {
            display: flex;
            align-items: center;
            background: var(--w);
            border-radius: var(--rad);
            padding: 0 12px;
            box-shadow: var(--sh)
        }

        .sbox input {
            flex: 1;
            border: none;
            outline: none;
            padding: 11px 8px;
            font-size: 15px;
            background: transparent
        }

        .sclr {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--gr);
            cursor: pointer;
            padding: 4px;
            display: none
        }

        .sclr.v {
            display: block
        }

        .chips {
            position: sticky;
            top: calc(var(--hh)+48px);
            z-index: 49;
            background: var(--grb);
            margin: 0 -8px;
            padding: 6px 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none
        }

        .chips::-webkit-scrollbar {
            display: none
        }

        .chip {
            display: inline-block;
            padding: 7px 12px;
            margin-right: 5px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            background: var(--w);
            color: #555;
            border: 2px solid var(--grl);
            cursor: pointer;
            user-select: none
        }

        .chip.active {
            background: var(--g);
            color: #fff;
            border-color: var(--g)
        }

        .cnt {
            font-size: 11px;
            color: var(--gr);
            padding: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .abtn {
            background: var(--g);
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer
        }

        .pc {
            background: var(--w);
            border-radius: var(--rad);
            padding: 10px 12px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            border-left: 4px solid transparent
        }

        .pc.sel {
            border-left-color: var(--g);
            background: var(--gb)
        }

        .pc .inf {
            flex: 1;
            min-width: 0
        }

        .pn {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 1px
        }

        .pm {
            font-size: 11px;
            color: var(--gr);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap
        }

        .ab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bb);
            color: var(--b);
            font-size: 10px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 6px;
            min-width: 24px
        }

        .ab.bf {
            background: #F3E5F5;
            color: #7B1FA2
        }

        .ab.bp {
            background: #E0F7FA;
            color: #00838F
        }

        .ab.em {
            background: var(--grl);
            color: var(--gr)
        }

        .ab.dp {
            background: #E8F5E9;
            color: #2E7D32
        }

        .pt {
            color: var(--g);
            font-weight: 600
        }

        .pno {
            font-size: 10px;
            color: #999;
            font-style: italic;
            margin-top: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px
        }

        .eb {
            background: none;
            border: none;
            font-size: 16px;
            padding: 4px;
            cursor: pointer;
            opacity: .3
        }

        .eb:active {
            opacity: 1
        }

        .qc {
            display: flex;
            align-items: center;
            flex-shrink: 0
        }

        .qb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid var(--g);
            background: #fff;
            color: var(--g);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .qb:active {
            transform: scale(.9)
        }

        .qb.a {
            background: var(--g);
            color: #fff
        }

        .qb.r {
            border-color: var(--r);
            color: var(--r)
        }

        .qv {
            width: 28px;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: var(--g)
        }

        .ls {
            background: var(--w);
            border-radius: var(--rad);
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--sh);
            text-align: center
        }

        .lsr {
            display: flex;
            justify-content: space-around
        }

        .sv {
            font-size: 26px;
            font-weight: 800;
            color: var(--g)
        }

        .sl {
            font-size: 10px;
            color: var(--gr);
            font-weight: 600;
            text-transform: uppercase
        }

        .as {
            margin-bottom: 10px
        }

        .ah {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            font-weight: 700;
            font-size: 13px;
            color: var(--b);
            position: sticky;
            top: var(--hh);
            background: var(--grb);
            z-index: 10
        }

        .ahb {
            background: var(--b);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px
        }

        .ahb.bf {
            background: #7B1FA2
        }

        .ahb.bp {
            background: #00838F
        }

        .ahb.na {
            background: var(--gr)
        }

        .li {
            background: var(--w);
            border-radius: var(--rad);
            padding: 12px 10px;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            transition: all .3s
        }

        .li.dn {
            opacity: 0;
            transform: translateX(80px);
            max-height: 0;
            padding: 0 10px;
            margin: 0
        }

        .ck {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 3px solid var(--g);
            background: #fff;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: transparent
        }

        .ck:active {
            background: var(--g);
            color: #fff
        }

        .lin {
            flex: 1
        }

        .lnm {
            font-size: 14px;
            font-weight: 600
        }

        .ld {
            font-size: 11px;
            color: var(--gr)
        }

        .lq {
            background: var(--ob);
            color: var(--o);
            font-size: 12px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px
        }

        .es {
            text-align: center;
            padding: 50px 20px;
            color: var(--gr)
        }

        .ei {
            font-size: 56px;
            margin-bottom: 12px
        }

        .et {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #444
        }

        .rb {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            background: #fff;
            color: var(--r);
            border: 2px solid var(--r);
            border-radius: var(--rad);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer
        }

        .rb:active {
            background: var(--r);
            color: #fff
        }

        .mo {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, .5);
            align-items: flex-end;
            justify-content: center
        }

        .mo.active {
            display: flex
        }

        .md {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 20px 16px calc(20px+var(--sb));
            animation: su .3s;
            max-height: 90vh;
            overflow-y: auto
        }

        @keyframes su {
            from {
                transform: translateY(100%)
            }

            to {
                transform: translateY(0)
            }
        }

        .md h2 {
            font-size: 17px;
            margin-bottom: 14px;
            text-align: center
        }

        .ml {
            background: var(--grb);
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            word-break: break-all;
            margin-bottom: 14px;
            text-align: center;
            color: var(--b)
        }

        .mb {
            display: block;
            width: 100%;
            padding: 13px;
            background: var(--g);
            color: #fff;
            border: none;
            border-radius: var(--rad);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 8px
        }

        .mb.s {
            background: var(--grl);
            color: #444
        }

        .mb.d {
            background: var(--r)
        }

        .mb:active {
            opacity: .8
        }

        .fg {
            margin-bottom: 12px
        }

        .fg label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--gr);
            margin-bottom: 4px
        }

        .fg input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--grl);
            border-radius: 8px;
            font-size: 15px
        }

        .fg input:focus {
            border-color: var(--g);
            outline: none
        }

        .fr {
            display: flex;
            gap: 8px
        }

        .fr .fg {
            flex: 1
        }

        .au {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: linear-gradient(135deg, #1B5E20, #2E7D32, #43A047);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px
        }

        .ac {
            background: #fff;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .15);
            text-align: center
        }

        .ac h1 {
            font-size: 48px;
            margin-bottom: 8px
        }

        .ac h2 {
            font-size: 20px;
            color: var(--g);
            margin-bottom: 4px
        }

        .ac p {
            font-size: 13px;
            color: var(--gr);
            margin-bottom: 20px
        }

        .ac input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--grl);
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 12px
        }

        .ac input:focus {
            border-color: var(--g);
            outline: none
        }

        .ac input[type=password] {
            letter-spacing: 4px
        }

        .ae {
            color: var(--r);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            min-height: 20px
        }

        .at {
            color: var(--b);
            font-size: 13px;
            cursor: pointer;
            margin-top: 12px;
            text-decoration: underline
        }

        .ss {
            padding: 20px 16px;
            max-width: 500px;
            margin: 0 auto
        }

        .ss h2 {
            color: var(--g);
            margin-bottom: 14px;
            font-size: 20px
        }

        .ss p {
            margin-bottom: 10px;
            font-size: 13px
        }

        .si {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 2px solid var(--grl);
            border-radius: 8px;
            font-size: 13px;
            font-family: monospace
        }

        .si:focus {
            border-color: var(--g);
            outline: none
        }

        .sb {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: var(--g);
            color: #fff;
            border: none;
            border-radius: var(--rad);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer
        }

        .sb.sk {
            background: var(--grl);
            color: #444;
            margin-top: 6px
        }

        .sn {
            background: var(--ob);
            padding: 10px;
            border-radius: 8px;
            margin: 14px 0;
            font-size: 12px
        }

        .stcard {
            background: var(--w);
            border-radius: var(--rad);
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: var(--sh)
        }

        .stcard h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--gr);
            margin-bottom: 12px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .st-big {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 4px
        }

        .st-big .sv {
            font-size: 32px
        }

        .st-big .sl {
            font-size: 10px;
            color: var(--gr);
            font-weight: 600;
            text-transform: uppercase
        }

        .st-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px
        }

        .st-bar-label {
            font-size: 12px;
            font-weight: 600;
            min-width: 90px;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .st-bar-track {
            flex: 1;
            height: 20px;
            background: var(--grl);
            border-radius: 10px;
            overflow: hidden;
            position: relative
        }

        .st-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width .5s;
            min-width: 2px
        }

        .st-bar-val {
            font-size: 11px;
            font-weight: 700;
            min-width: 50px;
            text-align: left;
            color: var(--gr)
        }

        .st-rank {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--grl)
        }

        .st-rank:last-child {
            border: none
        }

        .st-rank-num {
            font-size: 18px;
            font-weight: 800;
            color: var(--g);
            min-width: 28px;
            text-align: center
        }

        .st-rank-num.gold {
            color: #F9A825
        }

        .st-rank-num.silver {
            color: #90A4AE
        }

        .st-rank-num.bronze {
            color: #8D6E63
        }

        .st-rank-info {
            flex: 1
        }

        .st-rank-name {
            font-size: 13px;
            font-weight: 600
        }

        .st-rank-detail {
            font-size: 11px;
            color: var(--gr)
        }

        .st-rank-badge {
            font-size: 13px;
            font-weight: 700;
            color: var(--g);
            background: var(--gb);
            padding: 3px 10px;
            border-radius: 10px
        }

        .st-session {
            border-bottom: 1px solid var(--grl)
        }

        .st-session:last-child {
            border: none
        }

        .st-trip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            cursor: pointer
        }

        .st-trip-amounts {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            min-width: 86px
        }

        .st-amt-calc {
            font-size: 11px;
            color: var(--gr)
        }

        .st-amt-real {
            font-size: 15px;
            font-weight: 700;
            color: var(--g);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer
        }

        .st-amt-add {
            font-size: 11px;
            font-weight: 700;
            color: var(--o);
            background: var(--ob);
            border: none;
            padding: 4px 9px;
            border-radius: 8px;
            cursor: pointer
        }

        .st-caret {
            font-size: 11px;
            color: var(--gr);
            width: 12px;
            text-align: center;
            flex-shrink: 0
        }

        .st-trip-detail {
            padding: 2px 0 10px 80px
        }

        .st-detail-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
            padding: 3px 0;
            color: #444
        }

        .st-detail-row .q {
            color: var(--gr);
            font-weight: 600
        }

        .st-detail-empty {
            font-size: 12px;
            color: var(--gr)
        }

        .st-trip-date {
            min-width: 70px
        }

        .st-trip-day {
            font-size: 14px;
            font-weight: 700;
            color: #333
        }

        .st-trip-time {
            font-size: 10px;
            color: var(--gr)
        }

        .st-trip-info {
            flex: 1
        }

        .st-trip-items {
            font-size: 12px;
            color: var(--gr)
        }

        .st-trip-total {
            font-size: 15px;
            font-weight: 700;
            color: var(--g)
        }

        .st-empty {
            text-align: center;
            padding: 30px;
            color: var(--gr);
            font-size: 13px
        }

        .clr-hist-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: #fff;
            color: var(--gr);
            border: 1px solid var(--grl);
            border-radius: var(--rad);
            font-size: 12px;
            cursor: pointer
        }

        .toast {
            position: fixed;
            bottom: calc(var(--th)+var(--sb)+16px);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: #fff;
            padding: 10px 18px;
            border-radius: 22px;
            font-size: 13px;
            font-weight: 600;
            z-index: 300;
            transition: transform .3s;
            white-space: nowrap
        }

        .toast.v {
            transform: translateX(-50%) translateY(0)
        }

        ::-webkit-scrollbar {
            width: 0
        }
    </style>
</head>

<body>
    <div class="au" id="AS" style="display:none">
        <div class="ac">
            <h1>🛒</h1>
            <h2 id="aT">Lista Spesa</h2>
            <p id="aS">Crea una nuova lista</p>

        }

        async function hashPassword(password) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password));
            return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');

        // === Firebase ===

            try { return JSON.parse(localStorage.getItem('fbConf')) }

            if (!config) return false;
            try {
                if (!firebase.apps.length) firebase.initializeApp(config);
                db = firebase.database();
                firebase.database().ref('.info/connected').on('value', snap => {
                    isConnected = snap.val() === true;
                    updateConnectionBadge();
                });
                return true;
            } catch (e) { return false }
        }

        function updateConnectionBadge() {
            const el = $('cn');
            if (isConnected) {
                el.className = 'obadge on';
                el.textContent = '🟢 sync';
            } else if (getFirebaseConfig()) {
                el.className = 'obadge off';
                el.textContent = '🔴';
            } else {
                el.className = 'obadge off';
                el.textContent = '📱 locale';
            }
        }

        async function doAuth() {
            const name = $('aN').value.trim();
            const pin = $('aP').value.trim();
            const errorEl = $('aE');

            if (!name) { errorEl.textContent = 'Inserisci nome'; return }
            if (pin.length < 4) { errorEl.textContent = 'Min 4 caratteri'; return }

            const pinHash = await hashPassword(pin);

            // Modalità locale (senza Firebase)
            if (!db) {
                localStorage.setItem('uN', name);
                localStorage.setItem('lP', pinHash);

                if (authMode === 'create') {
                    listId = 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
                    localStorage.setItem('lid', listId);
                    location.hash = 'list=' + listId;
                    initLocal();
                } else {
                    listId = getHashListId() || localStorage.getItem('lid');
                    if (!listId) { errorEl.textContent = 'Nessuna lista'; return }
                    const savedPin = localStorage.getItem('lP');
                    if (savedPin && savedPin !== pinHash) { errorEl.textContent = 'Password errata'; return }
                }

                $('AS').style.display = 'none';
                $('hT').textContent = name;
                loadLocal();
                render();
                return;
            }

            // Modalità Firebase
            try {
                await firebase.auth().signInAnonymously();
                const uid = firebase.auth().currentUser.uid;

                if (authMode === 'create') {
                    listId = 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
                    location.hash = 'list=' + listId;
                    await db.ref('lists/' + listId + '/meta').set({ pinHash: pinHash, createdBy: uid, createdAt: Date.now() });
                    const prods = {};
                    DF.forEach((p, i) => { prods['p' + i] = p });
                    await db.ref('lists/' + listId + '/products').set(prods);
                    await db.ref('lists/' + listId + '/cart').set({});
                    await db.ref('lists/' + listId + '/users/' + uid).set({ name: name });
                    localStorage.setItem('lid', listId);
                    localStorage.setItem('uN', name);
                } else {
                    listId = getHashListId();
                    if (!listId) { errorEl.textContent = 'Nessuna lista nel link'; return }
                    const meta = (await db.ref('lists/' + listId + '/meta').once('value')).val();
                    if (!meta) { errorEl.textContent = 'Lista non trovata'; return }
                    if (meta.pinHash !== pinHash) { errorEl.textContent = 'Password errata'; return }
                    await db.ref('lists/' + listId + '/users/' + uid).set({ name: name });
                    localStorage.setItem('lid', listId);
                    localStorage.setItem('uN', name);
                }

                $('AS').style.display = 'none';
                $('hT').textContent = name;
                listenFirebase();
            } catch (e) {
                errorEl.textContent = 'Errore: ' + e.message;
            }
        }

            location.hash = '';
            location.reload();
        }

        // === Sincronizzazione Firebase (listener realtime) ===
        function listenFirebase() {
            let fbReady = 0;

            db.ref('lists/' + listId + '/products').on('value', snap => {
                const data = snap.val();
                products = data ? Object.entries(data).map(([k, v]) => ({ id: k, ...v })) : [];
                render();
                if (++fbReady >= 3) checkAllThresholds();
            });
            db.ref('lists/' + listId + '/cart').on('value', snap => {
                cart = snap.val() || {};
                render();
                ++fbReady;
            });
            db.ref('lists/' + listId + '/history').on('value', snap => {
                history = snap.val() || [];
                if (currentTab === 'stats') renderStats();
            });
            db.ref('lists/' + listId + '/pantry').on('value', snap => {
                pantry = snap.val() || {};
                if (currentTab === 'pantry') renderPantry();
                if (++fbReady >= 3) checkAllThresholds();
            });
            db.ref('lists/' + listId + '/actualCosts').on('value', snap => {
                actualCosts = snap.val() || {};
                if (currentTab === 'stats') renderStats();
            });
        }

        // === Salvataggio dati (Firebase o locale) ===
        function saveHistory() {
            if (db && listId) db.ref('lists/' + listId + '/history').set(history);
            else localStorage.setItem('lHi', JSON.stringify(history));
        }

        function saveActualCosts() {
            if (db && listId) db.ref('lists/' + listId + '/actualCosts').set(actualCosts);
            else localStorage.setItem('lAc', JSON.stringify(actualCosts));
        }

        function saveCart() {
            if (db && listId) db.ref('lists/' + listId + '/cart').set(cart);
            else { saveLocal(); render() }
        }

        function savePantry() {
            if (db && listId) db.ref('lists/' + listId + '/pantry').set(pantry);
            else { localStorage.setItem('lPa', JSON.stringify(pantry)); render() }
        }

        function saveCartItem(id) {
            if (db && listId) db.ref('lists/' + listId + '/cart/' + id).set(cart[id]);
            else { saveLocal(); render() }
        }

        function removeCartItem(id) {
            if (db && listId) db.ref('lists/' + listId + '/cart/' + id).remove();
            else { saveLocal(); render() }
        }

        function savePantryItem(id) {
            if (db && listId) db.ref('lists/' + listId + '/pantry/' + id).set(pantry[id]);
            else { localStorage.setItem('lPa', JSON.stringify(pantry)); render() }
        }

        // === Gestione carrello (lista della spesa) ===
        function addToCart(id) {
            cart[id] = { qty: (cart[id]?.qty || 0) + 1 };
            saveCartItem(id);
        }

        function removeFromCart(id) {
            if (!cart[id]) return;
            if (cart[id].qty > 1) {
                cart[id].qty--;
                saveCartItem(id);
            } else {
                delete cart[id];
                removeCartItem(id);
            }
        }

        function completeItem(id, el) {
            const product = products.find(x => x.id === id);
            const qty = cart[id]?.qty || 1;
            el.closest('.li').classList.add('dn');

            setTimeout(() => {
                if (product) {
                    logHistory([{ n: product.n, c: product.c, pr: product.pr, qty: qty }]);
                    if (!pantry[id]) pantry[id] = { qty: 0 };
                    pantry[id].qty += qty;
                    pantry[id].lastModified = Date.now();
                    pantry[id].lastModifiedBy = localStorage.getItem('uN');
                    savePantryItem(id);
                }
                delete cart[id];
                removeCartItem(id);
                checkThreshold(id);
            }, 300);
        }

        function resetCart() {
            if (!confirm('Svuotare?')) return;
            cart = {};
            saveCart();
            toast('Svuotata!');
            checkAllThresholds();
            renderList();
        }

        // === Storico spese ===
        function logHistory(items) {
            const trip = {
                ts: Date.now(),
                items: items,
                total: items.reduce((sum, i) => sum + i.pr * i.qty, 0)
            };
            history.push(trip);
            saveHistory();
        }

        // Raggruppa gli acquisti per "sessione di spesa": acquisti ravvicinati
        // nel tempo (entro SESSION_GAP_MS) appartengono alla stessa spesa.
        const SESSION_GAP_MS = 3 * 60 * 60 * 1000; // 3 ore

        // Prezzo corrente di un item: preso dal catalogo (per nome), con
        // fallback al prezzo salvato al momento dell'acquisto se il prodotto
        // non esiste più.
        function itemPrice(item) {
            const p = products.find(x => x.n === item.n);
            return p ? (p.pr || 0) : (item.pr || 0);
        }

        function groupSessions(trips) {
            const sorted = trips.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
            const sessions = [];
            sorted.forEach(t => {
                const last = sessions[sessions.length - 1];
                if (last && (t.ts || 0) - last.lastTs <= SESSION_GAP_MS) {
                    last.items.push(...(t.items || []));
                    last.lastTs = t.ts || last.lastTs;
                } else {
                    sessions.push({ ts: t.ts, lastTs: t.ts || 0, items: [...(t.items || [])] });
                }
            });
            sessions.forEach(s => {
                s.total = s.items.reduce((sum, i) => sum + itemPrice(i) * (i.qty || 1), 0);
            });
            return sessions;
        }

        // === Soglie dispensa (auto-restock) ===
        function checkThreshold(id) {
            const product = products.find(x => x.id === id);
            if (!product || !product.th || product.th <= 0) return;
            const qty = pantry[id]?.qty || 0;
            if (qty < product.th && !cart[id]) {
                cart[id] = { qty: 1 };
                saveCartItem(id);
                toast('🔔 ' + product.n + ' aggiunto a carrello (sotto soglia)');
            }
        }

        function checkAllThresholds() {
            products.forEach(product => {
                if (product.th && product.th > 0) {
                    const qty = pantry[product.id]?.qty || 0;
                    if (qty < product.th && !cart[product.id]) {
                        cart[product.id] = { qty: 1 };
                        saveCartItem(product.id);
                    }
                }
            });
        }

        // === Gestione dispensa ===
        function adjustPantry(id, delta) {
            if (!pantry[id]) pantry[id] = { qty: 0 };
            pantry[id].qty = Math.max(0, pantry[id].qty + delta);
            pantry[id].lastModified = Date.now();
            pantry[id].lastModifiedBy = localStorage.getItem('uN');
            savePantryItem(id);
            checkThreshold(id);
        }
        // === Rendering: Dispensa ===
        function renderPantry() {
            const el = $('paC');

            let items = products.filter(p => {
                const hasQty = (pantry[p.id]?.qty || 0) > 0;
                const hasThreshold = p.th && p.th > 0;
                return hasQty || hasThreshold;
            }).map(p => ({ ...p, qty: pantry[p.id]?.qty || 0 }));

            if (pantryQuery) {
                const q = pantryQuery.toLowerCase();
                items = items.filter(p => p.n.toLowerCase().includes(q) || (p.no || '').toLowerCase().includes(q));
            }
            items.sort((a, b) => a.n.localeCompare(b.n));

            if (!items.length) {
                el.innerHTML = '<div class="es"><div class="ei">🏠</div><div class="et">Dispensa vuota</div><div style="font-size:13px">Completa una spesa per popolare la dispensa!</div></div>';
                return;
            }

            const groups = {};
            items.forEach(i => { if (!groups[i.c]) groups[i.c] = []; groups[i.c].push(i) });
            const categories = Object.keys(groups).sort((a, b) => a.localeCompare(b));

            let h = '';
            categories.forEach(cat => {
                h += '<div class="as"><div class="ah"><span class="ahb">' + escapeHtml(cat) + '</span></div>';
                groups[cat].forEach(p => {
                    const isLow = p.th && p.th > 0 && p.qty < p.th;
                    const lowStyle = isLow ? ' style="border-left:3px solid var(--o)"' : '';
                    h += '<div class="pc"' + lowStyle + '><div class="inf"><div class="pn">' + escapeHtml(p.n) + '</div><div class="pm">';
                    if (p.th && p.th > 0) h += '<span class="ab bf">Soglia: ' + p.th + '</span>';
                    if (isLow) h += '<span class="ab" style="background:var(--ob);color:var(--o)">⚠ Sotto soglia</span>';
                    h += '</div>';
                    if (pantry[p.id]?.lastModified) {
                        const date = new Date(pantry[p.id].lastModified);
                        const dateStr = date.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });
                        const timeStr = date.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
                        const user = pantry[p.id].lastModifiedBy || '';
                        h += '<div class="pm" style="margin-top:2px">'
                            + '<span class="ab em">🕐 ' + dateStr + ' ' + timeStr + '</span>'
                            + (user ? '<span class="ab em">👤 ' + escapeHtml(user) + '</span>' : '')
                            + '</div>';
                    }
                    h += '</div>'
                        + '<div class="qc">'
                        + '<button class="qb r" onclick="adjustPantry(\'' + p.id + '\',-1)">−</button>'
                        + '<div class="qv">' + p.qty + '</div>'
                        + '<button class="qb a" onclick="adjustPantry(\'' + p.id + '\',1)">+</button>'
                        + '</div></div>';
                });
                h += '</div>';
            });
            el.innerHTML = h;
        }

        // === Form prodotto ===
        function showProductForm(id) {
            const isEdit = !!id;
            $('pT').textContent = isEdit ? 'Modifica' : 'Nuovo Prodotto';
            $('dB').style.display = isEdit ? 'block' : 'none';
            $('pI').value = id || '';
            $('dL').innerHTML = [...new Set(products.map(p => p.c))].sort().map(c => '<option value="' + c + '">').join('');

            if (isEdit) {
                const p = products.find(x => x.id === id);
                if (p) {
                    $('fN').value = p.n;
                    $('fA').value = p.a;
                    $('fP').value = p.pr;
                    $('fC').value = p.c;
                    $('fO').value = p.no;
                    $('fTh').value = p.th || '';
                }
            } else {
                ['fN', 'fA', 'fP', 'fC', 'fO', 'fTh'].forEach(x => $(x).value = '');
                if (currentCategory !== 'Tutti') $('fC').value = currentCategory;
            }
            $('pM').classList.add('active');
        }

        function saveProduct() {
            const id = $('pI').value;
            const name = $('fN').value.trim();
            const aisleInput = $('fA').value.trim().toUpperCase();
            const price = parseFloat($('fP').value) || 0;
            const category = $('fC').value.trim();
            const notes = $('fO').value.trim();
            const threshold = parseInt($('fTh').value) || 0;

            if (!name) { toast('❌ Nome!'); return }
            if (!category) { toast('❌ Categoria!'); return }

            const aisle = (aisleInput === 'BF' || aisleInput === 'BP') ? aisleInput : aisleInput.replace(/[^0-9]/g, '');
            const data = { n: name, a: aisle, c: category, pr: price, no: notes, th: threshold };

            if (db && listId) {
                id ? db.ref('lists/' + listId + '/products/' + id).set(data) : db.ref('lists/' + listId + '/products').push(data);
            } else {
                if (id) {
                    const idx = products.findIndex(p => p.id === id);
                    if (idx >= 0) products[idx] = { id, ...data };
                } else {
                    products.push({ id: 'p' + Date.now().toString(36), ...data });
                }
                saveLocal();
                render();
            }
            closeModal('pM');
            toast(id ? '✏️ Modificato' : '✅ Aggiunto');
            if (id) checkThreshold(id);
        }

        function deleteProduct() {
            const id = $('pI').value;
            if (!id || !confirm('Eliminare?')) return;

            if (db && listId) {
                db.ref('lists/' + listId + '/products/' + id).remove();
                if (cart[id]) { delete cart[id]; removeCartItem(id) }
            } else {
                products = products.filter(p => p.id !== id);
                if (cart[id]) delete cart[id];
                saveLocal();
                render();
            }
            closeModal('pM');
            toast('🗑️ Eliminato');
        }

        // === Rendering principale ===
        function render() {
            renderCatalog();
            renderList();
            if (currentTab === 'pantry') renderPantry();
            $('lB').textContent = Object.keys(cart).length || '';
        }

        // === Rendering: Chips categorie ===
        function renderChips() {
            const cats = ['Tutti', ...new Set(products.map(p => p.c))].sort((a, b) =>
                a === 'Tutti' ? -1 : b === 'Tutti' ? 1 : a.localeCompare(b)
            );
            $('ch').innerHTML = cats.map(c =>
                '<span class="chip' + (c === currentCategory ? ' active' : '') + '" onclick="selectCategory(\'' + c.replace(/'/g, "\\'") + '\')">' + c + '</span>'
            ).join('');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            renderChips();
            renderCatalog();
        }

        // === Rendering: Catalogo prodotti ===
        function renderCatalog() {
            renderChips();
            const el = $('pL');
            let filtered = products;

            if (currentCategory !== 'Tutti') {
                filtered = filtered.filter(p => p.c === currentCategory);
            }
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(p => p.n.toLowerCase().includes(q) || (p.no || '').toLowerCase().includes(q));
            }

            filtered.sort((a, b) => a.n.localeCompare(b.n));
            $('cT').textContent = filtered.length + ' prodotti';

            if (!filtered.length) {
                el.innerHTML = '<div class="es"><div class="ei">🔍</div><div class="et">Nessun risultato</div></div>';
                return;
            }

            el.innerHTML = filtered.map(p => {
                const aisleClass = p.a === 'BF' ? 'bf' : p.a === 'BP' ? 'bp' : p.a === '' ? 'em' : '';
                const cartQty = cart[p.id]?.qty || 0;
                return '<div class="pc">'
                    + '<div class="inf">'
                    + '<div class="pn">' + escapeHtml(p.n) + '</div>'
                    + '<div class="pm">'
                    + '<span class="ab ' + aisleClass + '">' + (p.a || '—') + '</span>'
                    + '<span class="pt">€' + p.pr.toFixed(2) + '</span>'
                    + '<span>' + escapeHtml(p.c) + '</span>'
                    + (p.th && p.th > 0 ? '<span class="ab bf">Soglia: ' + p.th + '</span>' : '')
                    + '</div>'
                    + (p.no ? '<div class="pno">' + escapeHtml(p.no) + '</div>' : '')
                    + '</div>'
                    + '<div class="qc">'
                    + '<button class="qb r" onclick="removeFromCart(\'' + p.id + '\');renderCatalog()">−</button>'
                    + '<span class="qv">' + cartQty + '</span>'
                    + '<button class="qb a" onclick="addToCart(\'' + p.id + '\');renderCatalog()">+</button>'
                    + '</div>'
                    + '<button class="eb" onclick="showProductForm(\'' + p.id + '\')">✏️</button>'
                    + '</div>';
            }).join('');
        }

        // === Rendering: Lista della spesa ===
        function aisleOrder(aisle) {
            return aisle === '' ? 9990 : aisle === 'BF' ? 9991 : aisle === 'BP' ? 9992 : parseInt(aisle) || 9989;
        }

        function aisleLabel(aisle) {
            return aisle === 'BF' ? '🧊 Banco Frigo'
                : aisle === 'BP' ? '🐟 Banco Pesce'
                : aisle === '' ? '📍 Senza corsia'
                : '🛒 Corsia ' + aisle;
        }

        function renderList() {
            const el = $('lC');
            let items = Object.entries(cart).map(([id, d]) => {
                const p = products.find(x => x.id === id);
                return p ? { ...p, qty: d.qty } : null;
            }).filter(Boolean);

            if (!items.length) {
                el.innerHTML = '<div class="es"><div class="ei">✅</div><div class="et">Lista vuota</div><div style="font-size:13px">Aggiungi dal Catalogo!</div></div>';
                return;
            }

            if (listQuery) {
                const q = listQuery.toLowerCase();
                items = items.filter(p => p.n.toLowerCase().includes(q) || (p.no || '').toLowerCase().includes(q));
            }

            const total = items.reduce((sum, i) => sum + i.pr * i.qty, 0);
            const count = items.reduce((sum, i) => sum + i.qty, 0);
            const groups = {};
            items.forEach(i => { if (!groups[i.a]) groups[i.a] = []; groups[i.a].push(i) });
            const aisles = Object.keys(groups).sort((a, b) => aisleOrder(a) - aisleOrder(b));

            let h = '<div class="ls"><div class="lsr">'
                + '<div><div class="sv">' + count + '</div><div class="sl">Prodotti</div></div>'
                + '<div><div class="sv">€' + total.toFixed(2) + '</div><div class="sl">Stima</div></div>'
                + '<div><div class="sv">' + aisles.length + '</div><div class="sl">Corsie</div></div>'
                + '</div></div>';

            aisles.forEach(aisle => {
                const aisleClass = aisle === 'BF' ? 'bf' : aisle === 'BP' ? 'bp' : aisle === '' ? 'na' : '';
                h += '<div class="as"><div class="ah"><span class="ahb ' + aisleClass + '">' + (aisle || '—') + '</span>' + aisleLabel(aisle) + '</div>';

                groups[aisle].forEach(item => {
                    const pantryQty = pantry[item.id]?.qty || 0;
                    h += '<div class="li">'
                        + '<button class="ck" onclick="completeItem(\'' + item.id + '\',this)">✓</button>'
                        + '<div class="lin">'
                        + '<div class="lnm">' + escapeHtml(item.n) + '</div>'
                        + '<div class="ld">' + escapeHtml(item.c) + (item.no ? ' · ' + escapeHtml(item.no) : '') + '</div>'
                        + (pantryQty > 0 ? '<div class="ld"><span class="ab dp">🏠 ' + pantryQty + ' in dispensa</span></div>' : '')
                        + '</div>'
                        + '<div class="qc">'
                        + '<button class="qb r" onclick="removeFromCart(\'' + item.id + '\')">−</button>'
                        + '<span class="qv">' + item.qty + '</span>'
                        + '<button class="qb a" onclick="addToCart(\'' + item.id + '\')">+</button>'
                        + '</div></div>';
                });
                h += '</div>';
            });

            h += '<button class="rb" onclick="resetCart()">🗑️ Svuota Lista</button>';
            el.innerHTML = h;
        }
        // === Rendering: Statistiche ===
        function renderStats() {
            const el = $('stC');

            if (!history.length) {
                el.innerHTML = '<div class="es"><div class="ei">📊</div><div class="et">Nessuna statistica</div><div style="font-size:13px">Completa delle spese per vedere i dati!</div></div>';
                return;
            }

            const sessions = groupSessions(history);
            const allItems = history.flatMap(t => t.items || []);
            const totalSpent = sessions.reduce((sum, s) => sum + (s.total || 0), 0);
            const totalItems = allItems.reduce((sum, i) => sum + (i.qty || 1), 0);
            const avgTrip = totalSpent / sessions.length;

            // Spesa per categoria (prezzi correnti dal catalogo)
            const catTotals = {};
            allItems.forEach(i => { catTotals[i.c] = (catTotals[i.c] || 0) + itemPrice(i) * (i.qty || 1) });
            const catSorted = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
            const maxCat = catSorted.length ? catSorted[0][1] : 1;

            // Prodotti più comprati
            const prodCount = {};
            allItems.forEach(i => { prodCount[i.n] = (prodCount[i.n] || 0) + (i.qty || 1) });
            const topProducts = Object.entries(prodCount).sort((a, b) => b[1] - a[1]).slice(0, 10);

            const colors = ['#2E7D32', '#1565C0', '#FF6F00', '#C62828', '#7B1FA2', '#00838F', '#F9A825', '#5D4037', '#455A64', '#E91E63', '#009688', '#FF5722', '#3F51B5', '#795548', '#607D8B', '#4CAF50', '#9C27B0', '#FF9800', '#03A9F4', '#8BC34A'];

            let h = '';

            // Ultime spese
            h += '<div class="stcard"><h3>🧾 Ultime Spese</h3>';
            const recent = sessions.slice().reverse().slice(0, 15);
            recent.forEach(trip => {
                const key = String(trip.ts);
                const d = new Date(trip.ts);
                const day = d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });
                const time = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
                const numItems = (trip.items || []).reduce((sum, i) => sum + (i.qty || 1), 0);
                const real = actualCosts[key];
                const expanded = expandedSessions.has(key);
                const amount = real != null
                    ? '<button class="st-amt-real" onclick="event.stopPropagation();editActualCost(\'' + key + '\')">€' + real.toFixed(2) + '</button>'
                    : '<button class="st-amt-add" onclick="event.stopPropagation();editActualCost(\'' + key + '\')">＋ reale</button>';

                h += '<div class="st-session"><div class="st-trip" onclick="toggleSession(\'' + key + '\')">'
                    + '<div class="st-trip-date"><div class="st-trip-day">' + day + '</div><div class="st-trip-time">' + time + '</div></div>'
                    + '<div class="st-trip-info"><div class="st-trip-items">' + numItems + ' prodotti</div></div>'
                    + '<div class="st-trip-amounts"><div class="st-amt-calc">≈ €' + (trip.total || 0).toFixed(2) + '</div>' + amount + '</div>'
                    + '<div class="st-caret">' + (expanded ? '▾' : '▸') + '</div></div>';

                if (expanded) {
                    const merged = {};
                    (trip.items || []).forEach(i => {
                        if (!merged[i.n]) merged[i.n] = { n: i.n, qty: 0, total: 0 };
                        merged[i.n].qty += (i.qty || 1);
                        merged[i.n].total += itemPrice(i) * (i.qty || 1);
                    });
                    const lines = Object.values(merged).sort((a, b) => a.n.localeCompare(b.n));
                    h += '<div class="st-trip-detail">';
                    h += lines.length
                        ? lines.map(l => '<div class="st-detail-row"><span>' + escapeHtml(l.n) + ' <span class="q">×' + l.qty + '</span></span><span>€' + l.total.toFixed(2) + '</span></div>').join('')
                        : '<div class="st-detail-empty">Nessun dettaglio</div>';
                    h += '</div>';
                }
                h += '</div>';
            });
            h += '</div>';

            // Riepilogo generale
            h += '<div class="stcard"><h3>📈 Riepilogo Generale</h3><div class="st-big">'
                + '<div><div class="sv">' + sessions.length + '</div><div class="sl">Spese</div></div>'
                + '<div><div class="sv">€' + totalSpent.toFixed(0) + '</div><div class="sl">Totale</div></div>'
                + '<div><div class="sv">€' + avgTrip.toFixed(0) + '</div><div class="sl">Media</div></div>'
                + '<div><div class="sv">' + totalItems + '</div><div class="sl">Prodotti</div></div>'
                + '</div></div>';

            // Grafico categorie
            h += '<div class="stcard"><h3>🏷️ Spesa per Categoria</h3>';
            catSorted.forEach((c, i) => {
                const pct = Math.round(c[1] / maxCat * 100);
                const clr = colors[i % colors.length];
                h += '<div class="st-bar-row">'
                    + '<div class="st-bar-label">' + escapeHtml(c[0]) + '</div>'
                    + '<div class="st-bar-track"><div class="st-bar-fill" style="width:' + pct + '%;background:' + clr + '"></div></div>'
                    + '<div class="st-bar-val">€' + c[1].toFixed(2) + '</div></div>';
            });
            h += '</div>';

            // Classifica prodotti
            h += '<div class="stcard"><h3>🏆 Prodotti più Comprati</h3>';
            if (topProducts.length) {
                topProducts.forEach((p, i) => {
                    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
                    h += '<div class="st-rank">'
                        + '<div class="st-rank-num ' + rankClass + '">' + (i + 1) + '</div>'
                        + '<div class="st-rank-info"><div class="st-rank-name">' + escapeHtml(p[0]) + '</div></div>'
                        + '<div class="st-rank-badge">×' + p[1] + '</div></div>';
                });
            } else {
                h += '<div class="st-empty">Nessun dato</div>';
            }
            h += '</div>';

            h += '<button class="clr-hist-btn" onclick="clearHistory()">🗑️ Cancella tutto lo storico</button>';
            el.innerHTML = h;
        }

        function clearHistory() {
            if (!confirm('Cancellare tutto lo storico?')) return;
            history = [];
            actualCosts = {};
            expandedSessions.clear();
            saveHistory();
            saveActualCosts();
            renderStats();
            toast('Storico cancellato');
        }

        // Espande/comprime una sessione di spesa per mostrarne i prodotti
        function toggleSession(key) {
            if (expandedSessions.has(key)) expandedSessions.delete(key);
            else expandedSessions.add(key);
            renderStats();
        }

        // Inserisce/modifica il costo reale pagato per una sessione di spesa
        function editActualCost(key) {
            const cur = actualCosts[key];
            const input = prompt('Costo reale della spesa (€):', cur != null ? cur : '');
            if (input === null) return;
            const v = input.trim().replace(',', '.');
            if (v === '') {
                delete actualCosts[key];
            } else {
                const n = parseFloat(v);
                if (isNaN(n) || n < 0) { toast('❌ Importo non valido'); return; }
                actualCosts[key] = Math.round(n * 100) / 100;
            }
            saveActualCosts();
            renderStats();
        }

        // === Navigazione tab ===
        function goToTab(tab) {
            currentTab = tab;
            $('cP').classList.toggle('active', tab === 'catalog');
            $('lP').classList.toggle('active', tab === 'list');
            $('paP').classList.toggle('active', tab === 'pantry');
            $('stP').classList.toggle('active', tab === 'stats');
            $('t1').classList.toggle('active', tab === 'catalog');
            $('t2').classList.toggle('active', tab === 'list');
            $('tPa').classList.toggle('active', tab === 'pantry');
            $('t3').classList.toggle('active', tab === 'stats');
            if (tab === 'list') renderList();
            if (tab === 'pantry') renderPantry();
            if (tab === 'stats') renderStats();
        }

        // === Ricerca ===
        $('sI').addEventListener('input', e => {
            searchQuery = e.target.value;
            $('sC').classList.toggle('v', searchQuery.length > 0);
            renderCatalog();
        });

        function clearSearch() {
            searchQuery = '';
            $('sI').value = '';
            $('sC').classList.remove('v');
            renderCatalog();
        }

        $('paSI').addEventListener('input', e => {
            pantryQuery = e.target.value;
            $('paSC').classList.toggle('v', pantryQuery.length > 0);
            renderPantry();
        });

        function clearPantrySearch() {
            pantryQuery = '';
            $('paSI').value = '';
            $('paSC').classList.remove('v');
            renderPantry();
        }

        $('lSI').addEventListener('input', e => {
            listQuery = e.target.value;
            $('lSC').classList.toggle('v', listQuery.length > 0);
            renderList();
        });

        function clearListSearch() {
            listQuery = '';
            $('lSI').value = '';
            $('lSC').classList.remove('v');
            renderList();
        }

        // === Condivisione e modali ===
        function showShareModal() {
            const url = location.origin + location.pathname + '#list=' + listId;
            $('sU').textContent = url;
            $('sM').classList.add('active');
        }

        function copyShareLink() {
            navigator.clipboard.writeText(location.origin + location.pathname + '#list=' + listId).then(() => {
                toast('✅ Link copiato!');
                closeModal('sM');
            });
        }

        function closeModal(id) {
            $(id).classList.remove('active');
        }

        // === Impostazioni Firebase ===
        function showSettings() {
            const config = getFirebaseConfig();
            if (config) $('fI').value = JSON.stringify(config, null, 2);
            $('sS').style.display = 'block';
            $('appV').textContent = APP_VERSION;
            $('cP').classList.remove('active');
            $('lP').classList.remove('active');
            $('stP').classList.remove('active');
        }

        function hideSettings() {
            $('sS').style.display = 'none';
            if (currentTab === 'catalog') $('cP').classList.add('active');
            else if (currentTab === 'list') $('lP').classList.add('active');
            else $('stP').classList.add('active');
        }

        function saveFirebaseConfig() {
            try {
                const config = JSON.parse($('fI').value);
                if (!config.apiKey || !config.databaseURL) throw new Error('Incompleta');
                localStorage.setItem('fbConf', JSON.stringify(config));
                toast('✅ OK!');
                hideSettings();
                location.reload();
            } catch (e) {
                toast('❌ ' + e.message);
            }
        }

        // === Inizializzazione ===
        function init() {
            const hasFirebase = initFirebase();
            updateConnectionBadge();

            const savedListId = localStorage.getItem('lid');
            const hashListId = getHashListId();
            const hasListId = savedListId || hashListId;

            if (hasFirebase && hasListId) {
                listId = hashListId || savedListId;
                if (!location.hash.includes('list=')) location.hash = 'list=' + listId;

                firebase.auth().signInAnonymously().then(() => {
                    const uid = firebase.auth().currentUser.uid;
                    db.ref('lists/' + listId + '/users/' + uid).once('value').then(snap => {
                        if (snap.val()) {
                            $('hT').textContent = snap.val().name || 'Spesa';
                            listenFirebase();
                        } else {
                            showAuth();
                        }
                    });
                }).catch(() => showAuth());
            }
            else if (!hasFirebase && savedListId && localStorage.getItem('uN')) {
                listId = savedListId;
                $('hT').textContent = localStorage.getItem('uN');
                loadLocal();
                render();
                checkAllThresholds();
            }
            else {
                showAuth();
            }
        }

        init();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
    </script>
</body>

</html>
